version: 1.3.5
cache: true

endpoints:
  custom:
    # OpenAI-compatible endpoint -> https://convertr.onrender.com/v1/chat/completions
    - name: "Convertr OpenAI"
      apiKey: "${CONVERTR_API_KEY}"
      baseURL: "https://convertr.onrender.com/v1"
      models:
        default:
          - "lightning-agent"
          - "gpt-5.6-sol"
          - "gpt-5.6-terra"
          - "gpt-5.6-luna"
          - "gpt-5.6"
          - "gpt-5"
          - "gpt-4o"
          - "gpt-4o-mini"
          - "gpt-4-turbo"
          - "gpt-3.5-turbo"
        fetch: true
      titleConvo: true
      titleModel: "current_model"

    - name: "Convertr Anthropic"
      apiKey: "${CONVERTR_API_KEY}"
      baseURL: "https://convertr.onrender.com/v1"
      provider: "anthropic"
      models:
        default: ["claude-sonnet-5", "claude-opus-4-8", "claude-opus-5", "claude-fable-5"]
        fetch: true
      titleConvo: true
      titleModel: "current_model"
