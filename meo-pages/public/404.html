<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f5f8" />
    <meta name="robots" content="noindex" />
    <title>页面不存在 · Meo AI</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --bg:#f4f5f8; --surface:#fff; --ink:#1d2433; --muted:#687386; --line:#e2e6ed; --accent:#5365d8; }
      @media (prefers-color-scheme: dark) { :root { --bg:#151821; --surface:#1e222d; --ink:#edf0f7; --muted:#a3adbd; --line:#333a49; --accent:#8794ff; } }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--ink); }
      main { width:min(520px,100%); padding:40px; text-align:center; border:1px solid var(--line); border-radius:24px; background:var(--surface); box-shadow:0 20px 55px rgb(34 45 76 / 8%); }
      .mark { display:grid; place-items:center; width:52px; height:52px; margin:0 auto 20px; border-radius:17px; color:#fff; background:var(--accent); font-weight:800; font-size:22px; }
      .code { margin:0 0 8px; color:var(--muted); font-size:13px; font-weight:700; letter-spacing:.08em; }
      h1 { margin:0 0 12px; font-size:30px; letter-spacing:-.035em; }
      p { margin:0 auto 24px; color:var(--muted); line-height:1.65; }
      a { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:10px 16px; border-radius:13px; background:var(--accent); color:#fff; text-decoration:none; font-weight:700; }
      a:focus-visible { outline:3px solid color-mix(in srgb,var(--accent) 35%,transparent); outline-offset:3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">m</div>
      <p class="code">404</p>
      <h1>这里没有这个页面</h1>
      <p>链接可能已经失效，或者地址输入有误。你的 Meo AI 会话和草稿不会因为来到这里而被删除。</p>
      <a href="/new">回到 Meo AI</a>
    </main>
  </body>
</html>
