kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ include "librechat.fullname" $ }}-configenv
data:
  {{- $configEnv := default dict .Values.librechat.configEnv }}
  {{- $adminPanelUrl := .Values.librechat.adminPanelUrl }}
  {{- $configAdminPanelUrl := dig "configEnv" "ADMIN_PANEL_URL" "" .Values.librechat }}
  {{- if (index .Values "librechat-rag-api" "enabled") }}
  RAG_API_URL: http://{{ include "rag.fullname" (index .Subcharts "librechat-rag-api") | lower }}.{{ .Release.Namespace | lower }}.svc.cluster.local:8000 
  {{- end }}
  {{- if and (not (dig "configEnv" "MEILI_HOST" "" .Values.librechat)) .Values.meilisearch.enabled }}
  MEILI_HOST: http://{{ include "meilisearch.fullname" .Subcharts.meilisearch }}.{{ .Release.Namespace | lower }}.svc.cluster.local:7700
  {{- end }}
  {{- if and (not (dig "configEnv" "MONGO_URI" "" .Values.librechat)) .Values.mongodb.enabled }}
  {{- $mongoNs := .Release.Namespace | lower }}
  {{- $mongoName := include "mongodb.fullname" .Subcharts.mongodb }}
  {{- /* mongodb.architecture cannot be `required` directly: the bundled Bitnami
         subchart's own values.yaml already defaults it to "standalone", and Helm
         coalesces that subchart default in before any parent template renders, so
         .Values.mongodb.architecture is never nil to fail on. librechat.mongoArchitectureAck
         has no such shadow default (it belongs only to this chart), so it can force the
         explicit, informed choice — cross-checked against the value actually in effect.
         Scoped to fresh installs only (.Release.IsInstall): an existing release that
         already has a bundled MongoDB running must keep upgrading on unrelated changes
         without this chart version suddenly demanding a values change it never needed
         before — it already silently inherits the standalone default (and the NOTES.txt
         warning below, printed on every install AND upgrade, keeps surfacing that). Only
         a fresh install is forced to make the choice explicitly before anything is created. */}}
  {{- if .Release.IsInstall }}
  {{- $mongoArchAck := required "librechat.mongoArchitectureAck must be set explicitly to \"standalone\" or \"replicaset\", matching mongodb.architecture — see the mongodb: comment in values.yaml" .Values.librechat.mongoArchitectureAck }}
  {{- if ne $mongoArchAck .Values.mongodb.architecture }}
  {{- fail (printf "librechat.mongoArchitectureAck (%q) does not match mongodb.architecture (%q) — set both to the same value" $mongoArchAck .Values.mongodb.architecture) }}
  {{- end }}
  {{- end }}
  {{- if eq .Values.mongodb.architecture "replicaset" }}
  {{- /* mongodb.service.nameOverride already resolves to "<fullname>-headless" in
         replicaset mode by default, and to the exact override value (no suffix) when
         mongodb.service.nameOverride is set — mirrors the subchart's own internal DNS
         construction, so a custom service name is honored instead of a hardcoded default. */}}
  MONGO_URI: mongodb://{{ $mongoName }}-0.{{ include "mongodb.service.nameOverride" .Subcharts.mongodb }}.{{ $mongoNs }}.svc.cluster.local:27017/LibreChat?replicaSet={{ .Values.mongodb.replicaSetName | default "rs0" }}
  {{- else }}
  MONGO_URI: mongodb://{{ include "mongodb.service.nameOverride" .Subcharts.mongodb }}.{{ $mongoNs }}.svc.cluster.local:27017/LibreChat
  {{- end }}
  {{- end }}
  {{- if and (not (dig "configEnv" "USE_REDIS" "" .Values.librechat)) .Values.redis.enabled }}
  USE_REDIS: "true"
  {{- end }}
  {{- if and (not (dig "configEnv" "REDIS_URI" "" .Values.librechat)) .Values.redis.enabled }}
  REDIS_URI: {{ include "librechat.bundledRedisURI" . }}
  {{- end }}
  {{- if and $adminPanelUrl (not $configAdminPanelUrl) }}
  ADMIN_PANEL_URL: {{ $adminPanelUrl | quote }}
  {{- end }}
  {{- if and .Values.langfuseFanout.enabled (not (hasKey $configEnv "LANGFUSE_FANOUT_ENABLED")) }}
  LANGFUSE_FANOUT_ENABLED: "true"
  {{- end }}
  {{- if and .Values.langfuseFanout.enabled (not (hasKey $configEnv "LANGFUSE_FANOUT_COLLECTOR_URL")) }}
  LANGFUSE_FANOUT_COLLECTOR_URL: http://{{ include "librechat.langfuseFanout.fullname" . }}.{{ .Release.Namespace | lower }}.svc.cluster.local:{{ .Values.langfuseFanout.service.port }}
  {{- end }}
  {{- if and .Values.langfuseFanout.enabled (not (hasKey $configEnv "LANGFUSE_FANOUT_TENANT_DESTINATIONS")) }}
  {{- include "librechat.langfuseFanout.validateDestinationKeys" . }}
  {{- $tenantDestinations := list }}
  {{- range $name, $destination := .Values.langfuseFanout.tenant.destinations }}
  {{- $tenantDestinations = append $tenantDestinations (printf "%s=%s" $name $destination.baseUrl) }}
  {{- end }}
  LANGFUSE_FANOUT_TENANT_DESTINATIONS: {{ join "," $tenantDestinations | quote }}
  {{- end }}
  {{- if $configEnv }}
  {{- $renderedConfigEnv := $configEnv }}
  {{- if and $adminPanelUrl (hasKey $configEnv "ADMIN_PANEL_URL") (not $configAdminPanelUrl) }}
  {{- $renderedConfigEnv = omit $configEnv "ADMIN_PANEL_URL" }}
  {{- end }}
  {{- if $renderedConfigEnv }}
  {{- toYaml $renderedConfigEnv | nindent 2 }}
  {{- end }}
  {{- end }}
