name: apply-neuronpool-example
on:
  push:
    branches: [neuronpool-example]
    paths:
      - scripts/apply-neuronpool-example.py
      - .github/workflows/apply-neuronpool-example.yml
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Insert NeuronPool example
        run: python3 scripts/apply-neuronpool-example.py
      - name: Commit patch and remove applicator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add librechat.example.yaml
          git rm -f scripts/apply-neuronpool-example.py .github/workflows/apply-neuronpool-example.yml
          git commit -m "feat: add NeuronPool custom endpoint example"
          git push
