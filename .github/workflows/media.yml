name: Media integration

on:
  pull_request:
    paths:
      - 'api/**'
      - 'client/**'
      - 'packages/**'
      - 'patches/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/media.yml'
      - '!**.md'
  push:
    branches: [dev]
    paths:
      - 'api/**'
      - 'client/**'
      - 'packages/**'
      - 'patches/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/media.yml'
      - '!**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: '--max-old-space-size=6144'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci
      - name: Verify the installed CJS and ESM native media contract
        run: npm run test:agents-contract
      - run: npm run e2e:prepare
      - name: Check workspace types
        run: |
          npm exec --workspace=packages/data-provider -- tsc --noEmit
          npm exec --workspace=packages/data-schemas -- tsc --noEmit
          npm exec --workspace=packages/api -- tsc --noEmit
          npm exec --workspace=client -- tsc --noEmit
      - name: Verify bounded native replay and runtime integration
        working-directory: packages/api
        run: npx jest --runInBand --coverage=false src/media/runtime.spec.ts
      - name: Verify media pagination and retained native consumers
        working-directory: packages/data-schemas
        run: npx jest --runInBand --coverage=false src/methods/media.spec.ts src/methods/mediaNative.spec.ts
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Exercise Media Studio with the local provider
        run: npm run e2e:media:run
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: media-results
          path: e2e/media/.test-results
          if-no-files-found: ignore
          retention-days: 7
