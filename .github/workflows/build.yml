name: Linux_Container_Workflow

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUNNER_VERSION: 2.293.0

jobs:
  baml-generation-freshness:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4

      - name: 'Use Node 24'
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - name: 'Install pinned BAML toolchain'
        run: |
          ./scripts/install-baml-toolchain.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 'Regenerate and require a clean BAML graph'
        run: |
          ./scripts/install-baml-toolchain.sh --verify
          npm --prefix packages/api run generate:baml
          baml check --from packages/api
          git diff --exit-code -- packages/api/baml_src packages/api/src/baml/generated packages/api/baml.generated.sha256

  build-and-push:
    needs: baml-generation-freshness
    runs-on: ubuntu-latest
    steps:
      # checkout the repo
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: 'Login via Azure CLI'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 'Build GitHub Runner container image'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - run: |
          docker build --build-arg RUNNER_VERSION=${{ env.RUNNER_VERSION }} -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/pwd9000-github-runner-lin:${{ env.RUNNER_VERSION }} .

      - name: 'Push container image to ACR'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - run: |
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/pwd9000-github-runner-lin:${{ env.RUNNER_VERSION }}
