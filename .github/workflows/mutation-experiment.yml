name: API Mutation Experiment

on:
  push:
    branches: [experiment/stryker-mutation-testing]
    paths:
      - 'stryker*.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/api/**'
      - 'packages/data-provider/**'
      - 'packages/data-schemas/**'
      - '.github/stryker-report.crt'
      - '.github/scripts/mutation-*.mjs'
      - '.github/workflows/mutation-experiment.yml'

permissions:
  contents: read

concurrency:
  group: mutation-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard:
          [
            '1/16',
            '2/16',
            '3/16',
            '4/16',
            '5/16',
            '6/16',
            '7/16',
            '8/16',
            '9/16',
            '10/16',
            '11/16',
            '12/16',
            '13/16',
            '14/16',
            '15/16',
            '16/16',
          ]
    env:
      SCARF_ANALYTICS: 'false'
      NODE_ENV: test
      NODE_OPTIONS: '--max-old-space-size=4096'
      MUTATION_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v5

      - name: Use the backend CI Node version
        uses: actions/setup-node@v5
        with:
          node-version: '24.16.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build dependencies and API fixtures
        run: |
          npm run build:data-provider
          npm run build:data-schemas
          npm run build:api

      - name: Record the source files assigned to this shard
        run: node .github/scripts/mutation-shards.mjs manifest

      - name: Cache MongoDB test binaries
        uses: actions/cache@v5
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-

      - name: Prepare MongoDB before timed tests
        run: node --input-type=module -e "import setup from './packages/data-schemas/jest.globalSetup.mjs'; await setup();"

      - name: Run this API shard for up to 45 minutes
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_SHA" > "$MUTATION_DIRECTORY/commit.txt"
          set +e
          timeout --foreground --signal=INT --kill-after=60s 45m \
            node node_modules/@stryker-mutator/core/bin/stryker.js run \
            stryker.api.config.mjs --concurrency 1 2>&1 \
            | node .github/scripts/mutation-progress.mjs "$MUTATION_DIRECTORY/run.log"
          statuses=("${PIPESTATUS[@]}")
          result=${statuses[0]}
          if [ "${statuses[1]}" -ne 0 ] && [ "$result" -eq 0 ]; then
            result=${statuses[1]}
          fi
          printf '%s\n' "$result" > "$MUTATION_DIRECTORY/exit-code.txt"
          if [ "$result" -eq 124 ] || [ "$result" -eq 137 ]; then
            echo 'Time limit reached or process killed. Any saved results are partial, not a complete API score.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$result" -ne 0 ]; then
            echo 'Stryker failed. Inspect the encrypted log before interpreting any results.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Stryker completed. The report is in the encrypted artifact.' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"

      - name: Write a complete, partial, or failed shard report
        if: ${{ always() && !cancelled() && env.MUTATION_DIRECTORY != '' }}
        run: node .github/scripts/mutation-reports.mjs render "$MUTATION_DIRECTORY"

      - name: Encrypt reports before uploading
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          if [ -z "$MUTATION_DIRECTORY" ] || [ ! -d "$MUTATION_DIRECTORY" ]; then
            exit 0
          fi
          tar -czf "$RUNNER_TEMP/mutation-api.tar.gz" -C reports/mutation/api-shards "$MUTATION_ID"
          openssl cms -encrypt -binary -aes-256-cbc \
            -in "$RUNNER_TEMP/mutation-api.tar.gz" \
            -out "$RUNNER_TEMP/mutation-api.tar.gz.cms" -outform DER \
            .github/stryker-report.crt
          rm "$RUNNER_TEMP/mutation-api.tar.gz"

      - name: Upload encrypted report
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: mutation-api-${{ env.MUTATION_ID }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mutation-api.tar.gz.cms
          if-no-files-found: ignore
          retention-days: 14
