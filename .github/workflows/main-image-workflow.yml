name: Docker Compose Build Release Image (Manual Dispatch)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to build (e.g. v0.8.7). Leave empty for the latest stable tag.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: api-build
            file: Dockerfile.multi
            image_name: librechat-api
          - target: node
            file: Dockerfile
            image_name: librechat

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        run: |
          set -euo pipefail
          git fetch --tags --force
          REQUESTED='${{ inputs.version }}'
          if [ -n "$REQUESTED" ]; then
            LATEST_TAG="$REQUESTED"
          else
            LATEST_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | { grep -E '^v[0-9]+[.][0-9]+[.][0-9]+$' || true; } | head -n 1)
          fi
          if [ -z "$LATEST_TAG" ]; then
            echo "::error::No stable v<semver> tag found"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$LATEST_TAG" >/dev/null; then
            echo "::error::Tag $LATEST_TAG does not exist"
            exit 1
          fi
          NEWEST_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | { grep -E '^v[0-9]+[.][0-9]+[.][0-9]+$' || true; } | head -n 1)
          if [ "$LATEST_TAG" = "$NEWEST_TAG" ]; then
            PUSH_LATEST=true
          else
            PUSH_LATEST=false
            echo "::notice::$LATEST_TAG is not the newest stable tag ($NEWEST_TAG); the :latest tag will not be moved"
          fi
          printf 'LATEST_TAG=%s\n' "$LATEST_TAG" >> "$GITHUB_ENV"
          printf 'PUSH_LATEST=%s\n' "$PUSH_LATEST" >> "$GITHUB_ENV"

      - name: Check out the release tag
        run: |
          set -euo pipefail
          git checkout --detach "refs/tags/$LATEST_TAG"
          git log -1 --format='Building %H (%d)'

      - name: Compute build metadata
        run: |
          set -euo pipefail
          printf 'BUILD_COMMIT=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          printf 'BUILD_BRANCH=%s\n' "$LATEST_TAG" >> "$GITHUB_ENV"
          printf 'BUILD_DATE=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          IMAGE='ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}'
          {
            echo 'IMAGE_TAGS<<IMAGE_TAGS_EOF'
            printf '%s:%s\n' "$IMAGE" "$LATEST_TAG"
            if [ "$PUSH_LATEST" = 'true' ]; then
              printf '%s:latest\n' "$IMAGE"
            fi
            echo 'IMAGE_TAGS_EOF'
          } >> "$GITHUB_ENV"

      # Set up QEMU
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Prepare the environment
      - name: Prepare environment
        run: |
          cp .env.example .env

      # Build and push Docker images for each target
      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ env.IMAGE_TAGS }}
          platforms: linux/amd64,linux/arm64
          target: ${{ matrix.target }}
          build-args: |
            BUILD_COMMIT=${{ env.BUILD_COMMIT }}
            BUILD_BRANCH=${{ env.BUILD_BRANCH }}
            BUILD_DATE=${{ env.BUILD_DATE }}
