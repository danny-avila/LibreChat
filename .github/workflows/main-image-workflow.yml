name: Docker Compose Build Latest Main Image Tag (Manual Dispatch)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Resolved once here rather than per build leg: the tag is an input to the
  # publish, and the merge job needs it too.
  resolve-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      latest_tag: ${{ steps.tag.outputs.latest_tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch tags and set the latest tag
        id: tag
        run: |
          set -euo pipefail
          git fetch --tags --force
          # `|| true` keeps pipefail from killing the step when grep matches
          # nothing, so the explicit error below is reachable.
          LATEST_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+[.][0-9]+[.][0-9]+$' | head -n 1 || true)
          if [ -z "$LATEST_TAG" ]; then
            echo "::error::No stable v<semver> tag found"
            exit 1
          fi
          printf 'latest_tag=%s\n' "$LATEST_TAG" >> "$GITHUB_OUTPUT"
          # Pin the publish to the commit this job resolved the tag from. `main`
          # is a moving ref: were each build leg to resolve it independently, the
          # amd64 and arm64 halves of one release could come from different
          # commits and still be published under the same tags.
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compute build metadata
        run: |
          printf 'BUILD_COMMIT=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          printf 'BUILD_BRANCH=main\n' >> "$GITHUB_ENV"
          printf 'BUILD_DATE=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      # Set up QEMU
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Prepare the environment
      - name: Prepare environment
        run: |
          cp .env.example .env

      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Build and push Docker images for each target
      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/${{ matrix.image_name }}:${{ env.LATEST_TAG }}
            ghcr.io/${{ env.OWNER }}/${{ matrix.image_name }}:latest
          platforms: linux/amd64,linux/arm64
          target: ${{ matrix.target }}
          build-args: |
            BUILD_COMMIT=${{ env.BUILD_COMMIT }}
            BUILD_BRANCH=${{ env.BUILD_BRANCH }}
            BUILD_DATE=${{ env.BUILD_DATE }}
