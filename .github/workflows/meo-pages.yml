name: Meo Pages

on:
  push:
    branches: [main]
    paths: ['meo-pages/**', 'client/src/components/Meo/**', '.github/workflows/meo-pages.yml']
  pull_request:
    paths: ['meo-pages/**', 'client/src/components/Meo/**', '.github/workflows/meo-pages.yml']
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meo-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/checkout@v4
        with:
          repository: QwQdoge/meo-ai
          ref: main
          path: canonical-meo-ai
          persist-credentials: false
      - name: Check shared UI navigation schema parity
        run: node ../canonical-meo-ai/meo/ui-schema/generate.mjs --check --web-output ../client/src/components/Meo/uiNavigation.generated.ts
      - run: npm test
      - run: npm run build
